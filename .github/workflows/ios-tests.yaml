name: iOS CI & Full Test Suite

on:
  push:
    branches:
      - main
      - master
      - develop
      - testing
  pull_request:
    branches:
      - main
      - master
      - develop
      - testing

jobs:
  test-ios:
    name: Build & Run Unit and UI Tests
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Boot iOS Simulator
        run: |
          echo "Looking for an available iPhone simulator..."

          SIM_UDID=$(xcrun simctl list devices available \
            | grep -m 1 "iPhone" \
            | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' \
            || true)

          if [ -z "$SIM_UDID" ]; then
            echo "::error::No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Selected simulator: $SIM_UDID"

          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          echo "SIMULATOR_UDID=$SIM_UDID" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        env:
          NSUnbufferedIO: 'YES'
        run: |
          xcodebuild test \
            -project GreenCheck.xcodeproj \
            -scheme GreenCheck \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:GreenCheckTests \
            clean

      - name: Run UI Tests
        env:
          NSUnbufferedIO: 'YES'
        run: |
          xcodebuild test \
            -project GreenCheck.xcodeproj \
            -scheme GreenCheck \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:GreenCheckUITests