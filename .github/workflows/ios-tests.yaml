name: iOS CI & Full Test Suite

on:
  push:
    branches: [ "main", "master", "develop", "testing" ]
  pull_request:
    branches: [ "main", "master", "develop", "testing" ]

jobs:
  test-ios:
    name: Build & Run Unit and UI Tests
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Select an iPhone 16 simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [ .devices | to_entries | sort_by(.key)[]
              | select(.key | contains("SimRuntime.iOS"))
              | .value[]
              | select(.name == "iPhone 16") ]
            | last | .udid // empty')

          if [ -z "$UDID" ]; then
            echo "No iPhone 16 simulator found. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Run Unit Tests (GreenCheckTests)
        env:
          NSUnbufferedIO: "YES"
        run: |
          xcodebuild test \
            -project GreenCheck.xcodeproj \
            -scheme GreenCheck \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:GreenCheckTests

      - name: Run UI Tests (GreenCheckUITests)
        env:
          NSUnbufferedIO: "YES"
        run: |
          xcodebuild test \
            -project GreenCheck.xcodeproj \
            -scheme GreenCheck \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:GreenCheckUITests