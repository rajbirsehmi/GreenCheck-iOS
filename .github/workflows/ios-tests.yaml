name: iOS CI & Full Test Suite

on:
  push:
    branches: [ "main", "master", "develop", "testing" ]
  pull_request:
    branches: [ "main", "master", "develop", "testing" ]

jobs:
  test-ios:
    name: Build & Run Unit and UI Tests
    runs-on: macos-14  # Uses default modern Xcode on macOS Sonoma

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Unit Tests (GreenCheckTests)
        env:
          NSUnbufferedIO: "YES"
        run: |
          xcodebuild test \
            -project GreenCheck.xcodeproj \
            -scheme GreenCheck \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -only-testing:GreenCheckTests \
            clean test

      - name: Run UI Tests (GreenCheckUITests)
        env:
          NSUnbufferedIO: "YES"
        run: |
          xcodebuild test \
            -project GreenCheck.xcodeproj \
            -scheme GreenCheck \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            -only-testing:GreenCheckUITests \
            test